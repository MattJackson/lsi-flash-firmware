# SAS2008 card identity database — TIER 2 (un-byte-confirmed)
#
# Identities in this file are forum-rumored or community-cited but NOT
# supported by a sample SBR, byte-diff RE, real-hardware lspci, or canonical
# pci.ids entry. The lsi-flash CLI does NOT embed this file at build time —
# it ships strict-only.
#
# To use these identities, copy this file (or specific entries) to:
#   ~/.config/lsi-flash/card-database.toml
#
# Then `lsi-flash sbr modify` will surface them with an [unverified] marker.
#
# Promotion path: when a Tier-2 entry is byte-confirmed via sample SBR,
# byte-diff RE, real-hardware lspci, or canonical pci.ids, move the row into
# `card-database.toml` and update its `confirmed_via` field with the cite.

schema_version = 1
last_updated = "2026-05-18"
tier = "rumored"

# ----------------------------------------------------------------------------
# Cards likely indistinguishable from stock LSI by PCI ID
# (passthrough OEMs that ship with LSI default SubsysVID:PID = 1000:3020)
# ----------------------------------------------------------------------------

[card.asus-pike-2008-it]
display = "Asus PIKE 2008 (IT/HBA variant) — likely uses LSI default IDs"
vid = 0x1000
did = 0x0072
subsys_vid = 0x1000      # forum consensus: "acts like M1015" with stock LSI IDs
subsys_pid = 0x3020      # rumored — same as stock LSI 9211-8i
chip_family = "SAS2008"
default_personality = "IT"
sas_oui = 0x500605b0
interface_byte = 0x00
quirks = []
confirmed_via = "RUMORED — community consensus (ServeTheHome, Unraid forums) that PIKE 2008 IT variant passes through LSI default IDs; no Asus-specific SubsysVID found in pci.ids or driver INFs"
notes = "Likely indistinguishable from LSI 9211-8i via PCI ID alone. Detect via stock-LSI match; user override recommended if user knows their card is a PIKE."

